server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://postgres_db:5432/db
    username: shop
    password: shop
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  data:
    redis:
      host: redis_db
      port: 6379
